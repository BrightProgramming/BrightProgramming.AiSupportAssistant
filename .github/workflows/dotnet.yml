name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore BrightProgramming.AiSupportAssistant.slnx

    - name: Build
      run: dotnet build BrightProgramming.AiSupportAssistant.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test BrightProgramming.AiSupportAssistant.slnx --no-build --configuration Release